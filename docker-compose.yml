services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ghcn
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres -d ghcn"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  importer:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ghcn?schema=public
      NOAA_IMPORT_ENABLED: ${NOAA_IMPORT_ENABLED:-1}
      NOAA_IMPORT_FORCE: ${NOAA_IMPORT_FORCE:-0}
      NOAA_END_YEAR: ${NOAA_END_YEAR:-2025}
      NOAA_CACHE_DIR: /data/noaa-cache
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - noaa_cache:/data/noaa-cache
    # WICHTIG: $$ -> verhindert Compose-Interpolation (kein "i variable is not set")
    command:
      [
        "sh",
        "-c",
        "i=0; until pnpm prisma migrate deploy; do i=$$((i+1)); echo \"DB not reachable yet (attempt $$i/30)\"; if [ $$i -ge 30 ]; then exit 1; fi; sleep 2; done; node apps/api/dist/importer/noaa.js",
      ]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ghcn?schema=public
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: production
      NOAA_END_YEAR: ${NOAA_END_YEAR:-2025}
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-10}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-500}
    ports:
      - "3001:3001"
    depends_on:
      importer:
        condition: service_completed_successfully
    volumes:
      - noaa_cache:/data/noaa-cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-Time (wichtig, da Next rewrites beim Build fest verdrahtet)
        API_BASE_URL: http://api:3001
        # Falls ihr irgendwo im Client eine BaseURL verwendet: empfehlenswert "same-origin"
        NEXT_PUBLIC_API_BASE_URL: /api
    environment:
      # Runtime (optional, aber sauber konsistent)
      API_BASE_URL: http://api:3001
      NEXT_PUBLIC_API_BASE_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  noaa_cache: