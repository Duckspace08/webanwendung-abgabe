services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ghcn
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  importer:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ghcn?schema=public
      NOAA_IMPORT_ENABLED: ${NOAA_IMPORT_ENABLED:-1}
      NOAA_IMPORT_FORCE: ${NOAA_IMPORT_FORCE:-0}
      NOAA_END_YEAR: ${NOAA_END_YEAR:-2025}
      NOAA_CACHE_DIR: /data/noaa-cache
    command: ["sh", "-c", "pnpm prisma migrate deploy && node apps/api/dist/importer/noaa.js"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - noaa_cache:/data/noaa-cache

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ghcn?schema=public
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: production
      NOAA_END_YEAR: ${NOAA_END_YEAR:-2025}
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-10}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-500}
    ports:
      - "3001:3001"
    depends_on:
      importer:
        condition: service_completed_successfully
    volumes:
      - noaa_cache:/data/noaa-cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  noaa_cache: