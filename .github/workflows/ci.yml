name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: ghcn
          POSTGRES_PASSWORD: ghcn
          POSTGRES_DB: ghcn
        options: >-
          --health-cmd "pg_isready -U ghcn -d ghcn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://ghcn:ghcn@localhost:5432/ghcn?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Keine Version angeben, wenn im Root package.json bereits "packageManager": "pnpm@x.y.z" steht.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Seed nutzt @webanwendung/shared -> dist muss existieren
      - name: Build shared (required for prisma seed)
        run: pnpm --filter ./packages/shared build

      # WICHTIG: Prisma Client generieren, sonst fehlt .prisma/client/*
      - name: Prisma generate
        run: pnpm prisma generate --schema prisma/schema.prisma

      - name: Prisma migrate + seed
        run: |
          pnpm prisma migrate deploy --schema prisma/schema.prisma
          pnpm prisma db seed --schema prisma/schema.prisma

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test Coverage
        run: pnpm test:coverage

      - name: Upload coverage report (HTML + lcov)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          if-no-files-found: error
          path: |
            apps/api/coverage
            apps/web/coverage
            packages/shared/coverage

      - name: Build
        run: pnpm build