name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      db:
        # PostGIS, weil ihr PostGIS im Canvas/Stack habt
        image: postgis/postgis:15-3.4
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ghcn
          POSTGRES_PASSWORD: ghcn
          POSTGRES_DB: ghcn
        options: >-
          --health-cmd "pg_isready -U ghcn -d ghcn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Prisma braucht DATABASE_URL im Prozess (Vitest lädt keine .env in CI)
      DATABASE_URL: postgresql://ghcn:ghcn@localhost:5432/ghcn?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm- 

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate + seed
        run: |
          pnpm prisma migrate deploy
          pnpm prisma db seed

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
